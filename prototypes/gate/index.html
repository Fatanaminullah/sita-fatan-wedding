<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gate prototype — Sita &amp; Fatan</title>

<!--
  Paper Theatre — sections 8.1 Gate + 8.2 Verse, driven by the owner's model.
  Scene: public/3d/wedding-venue.glb (door + hallway + chandeliers), authored
  in the "Animated doorway design" session; handover in
  public/3d/design_handoff_grand_door/README.md.

  Serve over http (the GLB cannot be fetched from file://):
    python3 -m http.server 8080   ->  /prototypes/gate/

  Debug poses: ?pose=open | ?pose=verse    Guest name: ?to=Nama%20Tamu
  Music: drop a music.mp3 next to this file and it plays on Enter.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --deep-red: #8a0f1a;
    --shadow-red: #5c0a12;
    --peach: #f6d4bc;
    --cream: #f7f0e6;
    --light: #ffe9c8;
    --ink: #2b1113;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden; /* scroll locked until entered; prototype is one viewport */
    background: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  #stage { position: fixed; inset: 0; }

  #gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- veil + name card ---------- */

  #veil {
    position: absolute;
    inset: 0;
    z-index: 4;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(43, 17, 19, 0.22) 0%, rgba(43, 17, 19, 0.6) 100%);
    transition: opacity 700ms ease;
  }
  #veil.lifted { opacity: 0; pointer-events: none; }

  #card {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: min(78vw, 320px);
    background: var(--cream);
    padding: 26px 22px 24px;
    text-align: center;
    /* blade-cut: hard shadow, tight offset, zero blur */
    box-shadow: 7px 9px 0 rgba(43, 17, 19, 0.55);
    transition: opacity 450ms ease, transform 450ms ease;
  }
  #card.away {
    opacity: 0;
    transform: translate(-50%, -62%);
    pointer-events: none;
  }
  #card .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--shadow-red);
  }
  #card h1 {
    font-family: "Bodoni Moda", serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.1;
    margin: 10px 0 14px;
  }
  #card .rule {
    width: 44px;
    height: 2px;
    background: var(--deep-red);
    margin: 0 auto 14px;
  }
  #card .to {
    font-size: 13px;
    color: var(--shadow-red);
  }
  #card .guest {
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 18px;
    overflow-wrap: anywhere;
  }
  #enter {
    display: inline-block;
    min-height: 48px;
    min-width: 160px;
    padding: 13px 30px;
    border: 0;
    background: var(--deep-red);
    color: var(--peach);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 4px 5px 0 var(--shadow-red);
  }
  #enter:active { transform: translate(2px, 2px); box-shadow: 2px 3px 0 var(--shadow-red); }
  #enter:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  #enter[disabled] { opacity: 0.6; cursor: wait; }

  /* ---------- loader: seam of light between closed doors ---------- */

  #loader {
    position: absolute;
    inset: 0;
    z-index: 8;
    background: var(--ink);
    display: grid;
    place-items: center;
    transition: opacity 500ms ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .seam {
    width: 2px;
    height: 42vh;
    background: var(--light);
    box-shadow: 0 0 18px 4px rgba(255, 233, 200, 0.55);
    animation: seam 1.6s ease-in-out infinite alternate;
  }
  @keyframes seam {
    from { width: 1px; opacity: 0.55; }
    to   { width: 5px; opacity: 1; }
  }
  #loader .err {
    position: absolute;
    bottom: 18vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(84vw, 420px);
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    color: var(--peach);
    display: none;
  }

  /* ---------- verse (section 8.2), the arrival state ---------- */

  #verse {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: radial-gradient(110% 90% at 50% 40%, rgba(43, 17, 19, 0.18) 0%, rgba(43, 17, 19, 0.72) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1400ms ease;
  }
  #verse.on { opacity: 1; }
  #verse .inner {
    /* pinned to the viewport edges so long lines can never overflow at 390 */
    position: absolute;
    left: 28px;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
    color: var(--cream);
  }
  #verse .arabic {
    font-size: 20px;
    line-height: 2;
    margin-bottom: 22px;
    color: var(--light);
  }
  #verse .translation {
    font-size: 16px;
    line-height: 1.7;
    opacity: 0.9;
  }
  #verse .source {
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  /* ---------- mute toggle ---------- */

  #mute {
    position: absolute;
    z-index: 9;
    right: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: var(--peach);
    color: var(--ink);
    display: none;
    place-items: center;
    cursor: pointer;
    box-shadow: 3px 4px 0 var(--shadow-red);
  }
  #mute.on { display: grid; }
  #mute svg { width: 22px; height: 22px; }
  #mute .slash { display: none; }
  #mute.muted .slash { display: block; }

  @media (min-width: 768px) {
    #card { width: 360px; }
    #card h1 { font-size: 38px; }
    #verse .arabic { font-size: 30px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #loader .seam { animation: none; }
    #veil, #card, #verse, #loader { transition: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>

  <div id="veil"></div>

  <div id="card" role="dialog" aria-label="Undangan">
    <p class="eyebrow">Undangan Pernikahan</p>
    <h1>Sita &amp; Fatan</h1>
    <div class="rule"></div>
    <p class="to">Kepada Bapak/Ibu</p>
    <p class="guest" id="guestName">Nama Tamu</p>
    <button id="enter" type="button" disabled>Masuk</button>
  </div>

  <div id="verse" aria-live="polite">
    <div class="inner">
      <!-- Placeholder only. The Arabic of Al-A'raf 189 is NEVER written by an
           AI from memory: sourced from a verified Quran source, checked by
           Fatan and Sita against a mushaf before ship. -->
      <p class="arabic">[ teks Arab dari sumber terverifikasi ]</p>
      <p class="translation">[ terjemahan disediakan pemilik ]</p>
      <p class="source">Q.S. Al-A&#8217;raf : 189</p>
    </div>
  </div>

  <div id="loader">
    <div class="seam"></div>
    <p class="err" id="loadErr"></p>
  </div>

  <button id="mute" type="button" aria-label="Bunyikan atau bisukan musik">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"></path>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      <line class="slash" x1="4" y1="4" x2="20" y2="20"></line>
    </svg>
  </button>

  <audio id="bgm" loop preload="none" src="music.mp3"></audio>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const GLB_URL = '../../public/3d/wedding-venue.glb';

/* Scene facts from the handover (README.md): meters, y-up, origin at the door
   threshold center. Doors open by rotating hinge_left +76deg / hinge_right
   -76deg. Hallway runs z -0.4 -> -18.9, ceiling 4.2 m; candelabra chandeliers
   at z -3.8 / -8.6 / -13.2; flush crystal chandelier at z -16.9. */
const OPEN_ANGLE = THREE.MathUtils.degToRad(76);
const CRYSTAL_Z = -16.9;

const params = new URLSearchParams(location.search);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pose = params.get('pose'); // null | 'open' | 'verse'

const guest = params.get('to');
if (guest) document.getElementById('guestName').textContent = guest;

const $ = (id) => document.getElementById(id);
const loader = $('loader');
const loadErr = $('loadErr');
const veil = $('veil');
const card = $('card');
const verse = $('verse');
const enterBtn = $('enter');
const muteBtn = $('mute');
const bgm = $('bgm');

/* ================================ three.js ================================ */

const canvas = $('gl');
let renderer = null;
let scene, camera, hingeL, hingeR;

function boot() {
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.setSize(innerWidth, innerHeight, false);
  } catch (err) {
    renderer = null;
    fail('WebGL tidak tersedia di peramban ini.');
    return;
  }

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x241a16);
  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 80);

  /* The handover's viewer shell lit the model with hemisphere + key + fill on
     top of the GLB's own warm point lights; recreate that here (no shadows,
     mid-range Android target). */
  scene.add(new THREE.HemisphereLight(0xfff0dd, 0x3a2418, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(4, 8, 10);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe9c8, 0.35);
  fill.position.set(-5, 3, 6);
  scene.add(fill);

  new GLTFLoader().load(
    GLB_URL,
    (gltf) => {
      scene.add(gltf.scene);
      hingeL = gltf.scene.getObjectByName('hinge_left');
      hingeR = gltf.scene.getObjectByName('hinge_right');
      if (!hingeL || !hingeR) {
        fail('Model dimuat tapi node hinge_left / hinge_right tidak ditemukan.');
        return;
      }
      onReady();
    },
    undefined,
    () => fail('Gagal memuat wedding-venue.glb. Buka lewat http, bukan file:// (python3 -m http.server 8080).')
  );
}

function fail(msg) {
  loadErr.textContent = msg;
  loadErr.style.display = 'block';
  const seam = loader.querySelector('.seam');
  if (seam) seam.style.animationPlayState = 'paused';
}

/* ------------------------------ camera poses ------------------------------ */

const lookTarget = new THREE.Vector3();

function startDist() {
  const aspect = innerWidth / innerHeight;
  return aspect < 0.8 ? 6.6 : aspect < 1.4 ? 5.8 : 5.4;
}

function cameraStart() {
  camera.position.set(0, 1.8, startDist());
  lookTarget.set(0, 2.3, 0);
  camera.lookAt(lookTarget);
}

function cameraVerse() {
  // past the last candelabra (z -13.2) so the crystal chandelier owns the frame
  camera.position.set(0, 1.7, -13.8);
  lookTarget.set(0, 2.6, -17.4);
  camera.lookAt(lookTarget);
}

function setDoors(t) {
  hingeL.rotation.y = OPEN_ANGLE * t;
  hingeR.rotation.y = -OPEN_ANGLE * t;
}

function render() {
  if (renderer) renderer.render(scene, camera);
}

function resize() {
  if (!renderer) return;
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (!entered) cameraStart();
  else if (arrived) cameraVerse();
  render();
}

/* ============================= state + timeline ============================ */

let entered = false;
let arrived = false;
let rafId = 0;

const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clamp01 = (t) => Math.min(1, Math.max(0, t));

function showVerse() {
  arrived = true;
  cancelAnimationFrame(rafId);
  setDoors(1);
  cameraVerse();
  render(); // hold the final frame; the loop stays dead from here
  verse.classList.add('on');
  muteBtn.classList.add('on');
  card.classList.add('away');
  veil.classList.add('lifted');
}

/* The walk: card away 0-0.45s · doors 0.35-1.9s · dolly through the hallway
   1.2-6.4s · verse fades as the camera settles under the crystal chandelier. */
const SEQ = { doors: [0.35, 1.9], dolly: [1.2, 6.4], verse: 5.9, end: 6.5 };
let seqStart = 0;
const camFrom = new THREE.Vector3();

function seqFrame(ts) {
  if (!seqStart) {
    seqStart = ts;
    camFrom.copy(camera.position);
  }
  const t = (ts - seqStart) / 1000;

  const dt = clamp01((t - SEQ.doors[0]) / (SEQ.doors[1] - SEQ.doors[0]));
  setDoors(easeInOutCubic(dt));

  const ct = clamp01((t - SEQ.dolly[0]) / (SEQ.dolly[1] - SEQ.dolly[0]));
  const e = easeInOutCubic(ct);
  camera.position.z = camFrom.z + (-13.8 - camFrom.z) * e;
  camera.position.y = camFrom.y + (1.7 - camFrom.y) * e;
  // gaze eases from the doorway up to the crystal chandelier at the far end
  const up = easeInOutCubic(clamp01((ct - 0.3) / 0.7));
  lookTarget.set(0, 2.3 + (2.6 - 2.3) * up, -2 + (-17.4 + 2) * e);
  camera.lookAt(lookTarget);

  if (t > SEQ.verse) verse.classList.add('on');

  if (t >= SEQ.end) {
    showVerse();
    return;
  }
  render();
  rafId = requestAnimationFrame(seqFrame);
}

function enter() {
  if (entered) return;
  entered = true;

  bgm.volume = 0.7;
  bgm.play().catch(() => {}); // no track in the repo; drop music.mp3 beside this file
  syncMuteUi();

  card.classList.add('away');
  veil.classList.add('lifted');

  if (reduceMotion) {
    showVerse();
    return;
  }
  cancelAnimationFrame(rafId);
  seqStart = 0;
  rafId = requestAnimationFrame(seqFrame);
}

enterBtn.addEventListener('click', enter);

/* Idle sparkle: a short settle after load, then the loop stops dead until tap. */
let idleStart = 0;
function idleFrame(ts) {
  if (!idleStart) idleStart = ts;
  const t = (ts - idleStart) / 1000;
  // barely-there breathing so the first frame does not look frozen
  camera.position.x = Math.sin(t * 0.5) * 0.03;
  camera.lookAt(lookTarget);
  render();
  if (t < 3.5 && !entered) rafId = requestAnimationFrame(idleFrame);
}

function onReady() {
  setDoors(0); // the GLB ships with the hinges baked open (+/-76deg); start closed
  cameraStart();
  render();
  enterBtn.disabled = false;
  loader.classList.add('done');

  if (pose === 'verse') {
    entered = true;
    showVerse();
    return;
  }
  if (pose === 'open') {
    setDoors(1);
    veil.classList.add('lifted');
    card.classList.add('away');
    render();
    return;
  }

  if (!reduceMotion) rafId = requestAnimationFrame(idleFrame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
}

/* mute toggle (state remembered) */
const MUTE_KEY = 'sf-gate-muted';
function syncMuteUi() {
  const muted = localStorage.getItem(MUTE_KEY) === '1';
  bgm.muted = muted;
  muteBtn.classList.toggle('muted', muted);
}
muteBtn.addEventListener('click', () => {
  const muted = localStorage.getItem(MUTE_KEY) === '1';
  localStorage.setItem(MUTE_KEY, muted ? '0' : '1');
  syncMuteUi();
});
syncMuteUi();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
    bgm.pause();
  } else {
    if (entered && !arrived) {
      // mid-sequence interruptions just finish the walk
      showVerse();
    } else {
      render();
    }
    if (entered && localStorage.getItem(MUTE_KEY) !== '1') bgm.play().catch(() => {});
  }
});

addEventListener('resize', resize);

boot();
</script>
</body>
</html>
